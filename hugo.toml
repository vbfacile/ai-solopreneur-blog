baseURL = "https://smartworkstack.com/"
languageCode = "en-us"
title = "SmartWorkStack"
theme = "congo"

[params]
  description = "Honest reviews and comparisons of AI tools, productivity apps, and automation workflows for solopreneurs and remote workers."
  colorScheme = "slate"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoading = true
  defaultThemeColor = "#334155"
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  showWordCount = false
  showEdit = false
  showViews = false
  showLikes = false
  showAuthor = true
  showDate = true
  showBreadcrumbs = true
  showPagination = true
  showSummary = true
  
  [params.author]
    name = "SmartWorkStack"
    image = ""
    headline = "AI Tools & Productivity Reviews"
    bio = "We test and compare productivity tools so you don't have to. Honest reviews, real comparisons, no fluff."
  
  [params.article]
    showTableOfContents = true
    showRelatedContent = true
    showBreadcrumbs = true
    showDate = true
    showDateUpdated = true
    showAuthor = true
    showHeadingAnchors = true
    showPagination = true
  
  [params.footer]
    showScrollToTop = true

  [params.homepage]
    layout = "profile"
    showRecent = true
    recentLimit = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[[menu.main]]
  name = "Articles"
  pageRef = "posts"
  weight = 2

[[menu.main]]
  name = "About"
  pageRef = "about"
  weight = 3

[[menu.main]]
  name = "Disclosure"
  pageRef = "disclosure"
  weight = 4
