baseURL = "https://www.smartworkstack.com/"
languageCode = "en-us"
title = "SmartWorkStack"
theme = "congo"

[params]
  description = "Honest reviews and comparisons of AI tools, productivity apps, and automation workflows for solopreneurs and remote workers."
  colorScheme = "slate"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoading = true
  defaultThemeColor = "#334155"
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  showWordCount = false
  showEdit = false
  showViews = false
  showLikes = false
  showAuthor = true
  showDate = true
  showBreadcrumbs = true
  showPagination = true
  showSummary = true
  
  [params.author]
    name = "SmartWorkStack"
    image = ""
    headline = "AI Tools & Productivity Reviews"
    bio = "We test and compare productivity tools so you don't have to. Honest reviews, real comparisons, no fluff."
  
  [params.article]
    showTableOfContents = true
    showRelatedContent = true
    showBreadcrumbs = true
    showDate = true
    showDateUpdated = true
    showAuthor = true
    showHeadingAnchors = true
    showPagination = true
  
  [params.footer]
    showScrollToTop = true

  [params.homepage]
    layout = "profile"
    showRecent = true
    recentLimit = 10

[[languages.en.menu.main]]
  name = "Articles"
  url = "/posts/"
  weight = 2

[[languages.en.menu.main]]
  name = "About"
  url = "/about/"
  weight = 3

[[languages.en.menu.main]]
  name = "Disclosure"
  url = "/disclosure/"
  weight = 4
