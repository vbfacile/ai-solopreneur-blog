baseURL = "https://smartworkstack.com"
languageCode = "en-us"
title = "SmartWorkStack"
theme = "blowfish"

[pagination]
  pagerSize = 10

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Outputs (JSON needed for search)
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ── Site Parameters ──────────────────────────────────────────
[params]
  # Appearance
  colorScheme = "blowfish"
  defaultAppearance = "light"
  autoSwitchAppearance = true

  # Site info
  description = "Honest reviews and comparisons of AI tools, productivity apps, and automation workflows for solopreneurs and remote workers."
  mainSections = ["posts"]
  robots = "index, follow"
  enableSearch = true
  enableCodeCopy = true

  # Features
  showScrollToTop = true
  showViews = false
  showLikes = false

  # Footer
  [params.footer]
    showCopyright = true
    showThemeAttribution = false
    showAppearanceSwitcher = true

  # Homepage
  [params.homepage]
    layout = "background"
    homepageImage = ""
    showRecent = true
    recentLimit = 12
    cardView = true
    cardViewScreenWidth = false
    layoutBackgroundBlur = true

  # Article defaults
  [params.article]
    showDate = true
    showDateUpdated = true
    showReadingTime = true
    showTableOfContents = true
    showRelatedContent = true
    relatedContentLimit = 3
    showBreadcrumbs = true
    showWordCount = false
    showEdit = false
    showViews = false
    showLikes = false
    showAuthor = true
    showPagination = true
    showSummary = true
    sharingLinks = ["twitter", "linkedin", "reddit", "email"]

  # List pages
  [params.list]
    showTableOfContents = false
    showSummary = true
    showCards = true
    groupByYear = false
    cardView = true
    cardViewScreenWidth = false

  # Taxonomy pages
  [params.taxonomy]
    showTermCount = true
    cardView = true

  # Author
  [params.author]
    name = "SmartWorkStack"
    headline = "AI Tools & Productivity Reviews"
    bio = "We test and compare AI tools so you don't have to. Honest reviews, real comparisons, no fluff."
    image = "img/author.png"
    links = []

  # Search (Fuse.js)
  [params.fuse]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ── Menus ────────────────────────────────────────────────────
[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Articles"
    pageRef = "/posts"
    weight = 2
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 3
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

# ── SEO ──────────────────────────────────────────────────────
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# ── Markup ───────────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false
